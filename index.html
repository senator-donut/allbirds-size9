      width: 56px; flex-shrink: 0; padding-right: 8px;
    }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-btn {
      border: 1.5px solid #edf0f4; background: #f7f9fc; color: #4a5568;
      padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600;
      cursor: pointer; font-family: inherit; line-height: 1.5;
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
    }
    .filter-btn:hover { border-color: #b0bdd0; background: #fff; color: #1a2744; }
    .filter-btn.active {
      background: #1a2744; border-color: #1a2744; color: #fff;
      box-shadow: 0 2px 6px rgba(26,39,68,.22);
    }

    /* ── section ── */
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .section-count {
      background: #e2e8f0; color: #4a5568; font-size: .75rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }
    .empty { color: #a0aec0; font-size: .9rem; padding: 12px 0; }

    /* ── grid ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

    /* ── card ── */
    .card {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: transform .15s, box-shadow .15s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .card-img-link { display: block; text-decoration: none; }
    .card-img-wrap { position: relative; aspect-ratio: 3/4; background: #f7f7f7; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-img-wrap img.thumb { object-fit: contain; padding: 18% 14%; background: #fff; }
    .img-placeholder {
      width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; color: #a0aec0; background: linear-gradient(160deg, #f7f9fc, #e9eef5); text-align: center; padding: 12px;
    }
    .ph-icon  { font-size: 2.2rem; opacity: .7; }
    .ph-style { font-size: 1rem; font-weight: 700; color: #4a5568; }
    .ph-note  { font-size: .7rem; color: #718096; }
    .badge {
      position: absolute; top: 8px; right: 8px;
      font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: .02em;
    }
    .badge-red    { background: #fff5f5; color: #c53030; }
    .badge-orange { background: #fffaf0; color: #c05621; }
    .badge-green  { background: #f0fff4; color: #276749; }
    .store-badge {
      position: absolute; top: 8px; left: 8px;
      font-size: .66rem; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      background: rgba(26,39,68,.85); color: #fff; letter-spacing: .03em; text-transform: uppercase;
    }

    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-cat { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: #718096; font-weight: 600; }
    .card-name { font-size: .85rem; font-weight: 600; line-height: 1.3; margin-top: 2px; }
    .card-name a { color: #1a2744; text-decoration: none; }
    .card-name a:hover { text-decoration: underline; }
    .card-color { font-size: .72rem; color: #a0aec0; }
    .card-price { margin-top: auto; padding-top: 8px; display: flex; align-items: baseline; gap: 6px; }
    .orig-price { font-size: .78rem; color: #a0aec0; text-decoration: line-through; }
    .sale-price { font-size: 1rem; font-weight: 700; color: #c53030; }
    .size-tag { font-size: .7rem; font-weight: 700; margin-top: 2px; color: #276749; }
    .days-badge {
      font-size: .68rem; font-weight: 700; color: #718096; background: #edf2f7;
      border-radius: 4px; padding: 2px 6px; display: inline-block; margin-top: 4px; letter-spacing: .02em;
      align-self: flex-start;
    }
    .days-badge.days-new { color: #276749; background: #f0fff4; }

    footer { max-width: 1400px; margin: 0 auto; padding: 0 32px 40px; font-size: .75rem; color: #a0aec0; }

    @media (max-width: 600px) {
      header { padding: 10px 16px; position: static; }
      header h1 { font-size: 1.1rem; }
      .header-meta { font-size: .72rem; margin-top: 2px; }
      .stats { gap: 5px; }
      .stat { padding: 6px 10px; min-width: 60px; }
      .stat-val { font-size: 1.1rem; }
      .stat-label { font-size: .62rem; }
      main { padding: 16px; }
      footer { padding: 0 16px 32px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>👟 Allbirds · Women's Size <span id="size-label">9</span></h1>
      <div class="header-meta">
        <span id="updated-label"></span>
        <span id="run-status" class="status-badge"></span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <div class="store-strip" id="store-strip"></div>

  <div id="search-bar">
    <input id="search-box" type="search" placeholder="🔍 Search style, color, store, item #…" autocomplete="off" spellcheck="false">
    <button id="search-clear" hidden>✕</button>
  </div>

  <div id="sort-bar">
    <span class="sort-label">Sort:</span>
    <button class="sort-btn active" data-sort="discount" data-dir="desc">Discount ↓</button>
    <button class="sort-btn" data-sort="price" data-dir="asc">Price ↑</button>
    <button class="sort-btn" data-sort="price" data-dir="desc">Price ↓</button>
    <button class="sort-btn" data-sort="found" data-dir="desc">Newest First</button>
    <button class="sort-btn" data-sort="store" data-dir="asc">Store A–Z</button>
  </div>

  <div id="filter-bar"></div>

  <section>
    <h2><span id="section-title">All Finds</span> <span class="section-count" id="section-count">0</span></h2>
    <div class="grid" id="main-grid"></div>
    <div class="empty" id="empty-msg" hidden>No pairs match these filters.</div>
  </section>
</main>

<footer>
  Size 9 comes from each store's own size filter; the store sites don't print sizes on product tiles.
  Stock at off-price stores changes fast, so tap through to confirm before you go.
</footer>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('report-data').textContent);
  var items = DATA.items || [];
  var stores = DATA.stores || [];

  // ── helpers ──
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) {
    if (n == null || isNaN(n)) return '';
    return '$' + (Math.round(n) === n ? n.toFixed(0) : n.toFixed(2));
  }
  // Style family from the title; first match wins.
  var STYLES = ['Kiwi', 'Varsity', 'Cruiser', 'Runner NZ', 'Wool', 'Trail', 'Tree'];
  function styleOf(title) {
    for (var i = 0; i < STYLES.length; i++) if (title.indexOf(STYLES[i]) !== -1) return STYLES[i];
    return 'Other';
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function daysAgo(dateStr) {
    var d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d)) return null;
    var today = new Date(); today.setHours(12, 0, 0, 0);
    return Math.max(0, Math.round((today - d) / 86400000));
  }

  items.forEach(function (it) {
    it.discount = it.compareAt > it.price ? Math.round((1 - it.price / it.compareAt) * 100) : 0;
    it.storeSlug = slug(it.store);
    it.style = styleOf(it.title);
  });

  // ── header ──
  document.getElementById('size-label').textContent = DATA.size || '9';
  document.getElementById('updated-label').textContent = DATA.updated ? 'Updated ' + fmtDateTime(DATA.updated) : '';
  var running = stores.filter(function (s) { return s.status === 'in-progress'; });
  var pending = stores.filter(function (s) { return s.status === 'not-started'; });
  var runStatus = document.getElementById('run-status');
  if (running.length) {
    runStatus.className = 'status-badge busy';
    runStatus.textContent = '⏳ Still searching ' + running.map(function (s) { return s.name; }).join(', ');
  } else if (pending.length) {
    runStatus.className = 'status-badge closed';
    runStatus.textContent = pending.length + ' store' + (pending.length > 1 ? 's' : '') + ' not searched yet';
  } else {
    runStatus.className = 'status-badge live';
    runStatus.textContent = '✓ All stores searched';
  }

  // ── stats (header buttons act as quick views) ──
  var views = [
    { key: 'all',    label: 'Pairs Found', test: function () { return true; } },
    { key: 'd60',    label: '≥60% Off',    test: function (it) { return it.discount >= 60; } },
    { key: 'under30', label: 'Under $30',  test: function (it) { return it.price < 30; } },
    { key: 'new',    label: 'Found Today', test: function (it) { return daysAgo(it.found) === 0; } }
  ];
  var statsEl = document.getElementById('stats');
  statsEl.innerHTML = views.map(function (v, i) {
    var n = items.filter(v.test).length;
    return '<button class="stat' + (i === 0 ? ' active' : '') + '" data-view="' + v.key + '">' +
      '<div class="stat-val">' + n + '</div><div class="stat-label">' + esc(v.label) + '</div></button>';
  }).join('');

  // ── store status strip ──
  document.getElementById('store-strip').innerHTML = stores.map(function (s) {
    var found = items.filter(function (it) { return it.store === s.name; }).length;
    var statusText = { 'complete': 'Searched', 'in-progress': 'Searching…', 'not-started': 'Not yet' }[s.status] || s.status;
    var detail = [];
    if (s.searched) detail.push(s.searched.toLocaleString() + ' size-9 shoes checked');
    if (s.ranAt) detail.push((s.status === 'in-progress' ? 'started ' : '') + fmtTime(s.ranAt));
    return '<div class="store-card">' +
      '<div class="store-top"><span class="store-name">' + esc(s.name) + '</span>' +
      '<span class="pill pill-' + esc(s.status) + '">' + esc(statusText) + '</span></div>' +
      '<div class="store-found">' + (s.status === 'not-started' ? '—' : found) + '<span>' + (found === 1 ? 'pair' : 'pairs') + '</span></div>' +
      '<div class="store-detail">' + esc(detail.join(' · ')) + '</div></div>';
  }).join('');

  // ── filter bar ──
  var storeNames = stores.map(function (s) { return s.name; });
  items.forEach(function (it) { if (storeNames.indexOf(it.store) === -1) storeNames.push(it.store); });
  var priceBands = [
    { val: 'u30',  label: 'Under $30',  test: function (p) { return p < 30; } },
    { val: 'o30',  label: '$30 & up',   test: function (p) { return p >= 30; } }
  ];
  function pills(dim, opts) {
    return '<button class="filter-btn active" data-dim="' + dim + '" data-val="all">All</button>' +
      opts.map(function (o) {
        return '<button class="filter-btn" data-dim="' + dim + '" data-val="' + esc(o.val) + '">' + esc(o.label) + '</button>';
      }).join('');
  }
  var styleNames = STYLES.concat('Other').filter(function (n) {
    return items.some(function (it) { return it.style === n; });
  });
  document.getElementById('filter-bar').innerHTML =
    '<div class="filter-row"><span class="filter-label">Style</span><div class="filter-pills">' +
      pills('style', styleNames.map(function (n) {
        var c = items.filter(function (it) { return it.style === n; }).length;
        return { val: n, label: n + ' (' + c + ')' };
      })) + '</div></div>' +
    '<div class="filter-row"><span class="filter-label">Store</span><div class="filter-pills">' +
      pills('store', storeNames.map(function (n) {
        var c = items.filter(function (it) { return it.store === n; }).length;
        return { val: slug(n), label: n + ' (' + c + ')' };
      })) + '</div></div>' +
    '<div class="filter-row"><span class="filter-label">Price</span><div class="filter-pills">' +
      pills('price', priceBands.map(function (b) { return { val: b.val, label: b.label }; })) + '</div></div>';

  // ── cards ──
  var grid = document.getElementById('main-grid');
  function cardHtml(it) {
    var badgeCls = it.discount >= 60 ? 'badge-red' : it.discount >= 40 ? 'badge-orange' : 'badge-green';
    var d = daysAgo(it.found);
    var foundTxt = d === null ? '' : d === 0 ? 'found today' : d === 1 ? 'found yesterday' : 'found ' + d + 'd ago';
    var ids = (it.color ? it.color + ' · ' : '') + 'Item #' + it.productId;
    return '<div class="card">' +
      '<a href="' + esc(it.url) + '" target="_blank" rel="noopener" class="card-img-link">' +
        '<div class="card-img-wrap">' +
          (it.image ? '<img src="' + esc(it.image) + '" alt="' + esc(it.title) + '" loading="lazy"' + (it.thumb ? ' class="thumb"' : '') + ' ' +
            'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' : '') +
          '<div class="img-placeholder"' + (it.image ? '' : ' style="display:flex"') + '>' +
            '<span class="ph-icon">👟</span><span class="ph-style">' + esc(it.style === 'Other' ? 'Allbirds' : it.style) + '</span>' +
            '<span class="ph-note">Tap for photo on ' + esc(it.store) + '</span></div>' +
          '<span class="store-badge">' + esc(it.store) + '</span>' +
          (it.discount ? '<span class="badge ' + badgeCls + '">' + it.discount + '% off</span>' : '') +
        '</div></a>' +
      '<div class="card-body">' +
        '<div class="card-cat">Allbirds</div>' +
        '<div class="card-name"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></div>' +
        '<div class="card-color">' + esc(ids) + '</div>' +
        '<div class="card-price">' +
          (it.compareAt > it.price ? '<span class="orig-price">' + money(it.compareAt) + '</span>' : '') +
          '<span class="sale-price">' + money(it.price) + '</span>' +
        '</div>' +
        '<div class="size-tag">✓ Women\'s ' + esc(DATA.size || '9') + '</div>' +
        (foundTxt ? '<div class="days-badge' + (d === 0 ? ' days-new' : '') + '">' + foundTxt + '</div>' : '') +
      '</div></div>';
  }

  // ── state + render ──
  var state = { view: 'all', style: 'all', store: 'all', price: 'all', q: '', sort: 'discount', dir: 'desc' };

  function render() {
    var view = views.filter(function (v) { return v.key === state.view; })[0];
    var band = priceBands.filter(function (b) { return b.val === state.price; })[0];
    var list = items.filter(function (it) {
      if (!view.test(it)) return false;
      if (state.store !== 'all' && it.storeSlug !== state.store) return false;
      if (state.style !== 'all' && it.style !== state.style) return false;
      if (band && !band.test(it.price)) return false;
      if (state.q) {
        var hay = [it.title, it.store, it.productId, it.colorId, it.color, 'allbirds'].join(' ').toLowerCase();
        if (hay.indexOf(state.q) === -1) return false;
      }
      return true;
    });
    var sign = state.dir === 'asc' ? 1 : -1;
    list.sort(function (a, b) {
      var x, y;
      if (state.sort === 'store') { x = a.store; y = b.store; }
      else if (state.sort === 'found') { x = a.found || ''; y = b.found || ''; }
      else { x = a[state.sort]; y = b[state.sort]; }
      if (x < y) return -sign;
      if (x > y) return sign;
      return a.price - b.price;
    });
    grid.innerHTML = list.map(cardHtml).join('');
    document.getElementById('section-title').textContent = view.key === 'all' ? 'All Finds' : view.label;
    document.getElementById('section-count').textContent = list.length;
    document.getElementById('empty-msg').hidden = list.length > 0;
  }

  statsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.stat');
    if (!btn) return;
    statsEl.querySelectorAll('.stat').forEach(function (s) { s.classList.remove('active'); });
    btn.classList.add('active');
    state.view = btn.getAttribute('data-view');
    render();
  });

  document.getElementById('filter-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    state[btn.getAttribute('data-dim')] = btn.getAttribute('data-val');
    btn.closest('.filter-row').querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });

  document.querySelectorAll('.sort-btn[data-sort]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.sort-btn[data-sort]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.sort = btn.getAttribute('data-sort');
      state.dir = btn.getAttribute('data-dir');
      render();
    });
  });

  var searchBox = document.getElementById('search-box');
  var searchClear = document.getElementById('search-clear');
  var timer = null;
  searchBox.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = searchBox.value.trim().toLowerCase();
      searchClear.hidden = !state.q;
      render();
    }, 120);
  });
  searchClear.addEventListener('click', function () {
    searchBox.value = ''; state.q = ''; searchClear.hidden = true; render(); searchBox.focus();
  });

  render();
}());
</script>

</body>
</html>
