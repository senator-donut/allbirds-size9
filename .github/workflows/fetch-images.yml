name: Fetch product photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, .github/scripts/fetch_images.py]

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: python3 .github/scripts/fetch_images.py
      - name: Commit new photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No new photos."
          else
            git commit -m "Add downloaded product photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
